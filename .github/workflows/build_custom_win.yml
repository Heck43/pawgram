name: Build Custom Telegram Windows (x64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  UPLOAD_ARTIFACT: "true"
  ONLY_CACHE: "false"

defaults:
  run:
    shell: cmd

jobs:
  windows:
    name: Build Telegram (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Free Runner Disk Space (Safe)
        shell: pwsh
        run: |
          Write-Host "Free disk space before cleanup:"
          Get-PSDrive C, D -ErrorAction SilentlyContinue | Select-Object Name, @{Name="FreeGB";Expression={[math]::Round($_.Free/1GB, 2)}}
          
          # Delete heavy SDKs not needed for C++ (Ruby, Go, Java, CodeQL, PyPy, Android, MongoDB, MySQL, .NET caches)
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Ruby" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\go" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java*" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\CodeQL" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\PyPy" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\SeleniumWebDrivers" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\MongoDB" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\MySQL" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Users\runneradmin\.dotnet" -ErrorAction SilentlyContinue
          
          Write-Host "Free disk space after cleanup:"
          Get-PSDrive C, D -ErrorAction SilentlyContinue | Select-Object Name, @{Name="FreeGB";Expression={[math]::Round($_.Free/1GB, 2)}}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Patch CMake MSVC Debug Flags
        shell: bash
        run: |
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake || true

      - name: Checkout Custom Codebase
        uses: actions/checkout@v4
        with:
          path: custom_src

      - name: Restore Libraries Cache
        id: cache-libraries
        uses: actions/cache@v4
        with:
          path: |
            C:/Users/runneradmin/TBuild/Libraries/win64
            C:/Users/runneradmin/TBuild/ThirdParty
          key: libraries-v709-${{ hashFiles('custom_src/Telegram/build/prepare/**') }}
          restore-keys: |
            libraries-v709-

      - name: Restore Build Cache
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            C:/Users/runneradmin/TBuild/TelegramCustom/out
          key: build-cache-${{ github.sha }}
          restore-keys: |
            build-cache-

      - name: Clone Official TDesktop with Submodules
        run: |
          if exist "%TBUILD%\TelegramCustom" rmdir /s /q "%TBUILD%\TelegramCustom"
          git clone --depth 1 --branch v7.0.9 --recurse-submodules https://github.com/telegramdesktop/tdesktop.git %TBUILD%\TelegramCustom

      - name: Apply Custom Modifications
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\custom_src"
          $dst = "$env:TBUILD\TelegramCustom"
          
          Copy-Item -Recurse -Force "$src\Telegram\SourceFiles\custom_features" "$dst\Telegram\SourceFiles\"
          Copy-Item -Force "$src\Telegram\SourceFiles\settings\sections\settings_custom.h" "$dst\Telegram\SourceFiles\settings\sections\"
          Copy-Item -Force "$src\Telegram\SourceFiles\settings\sections\settings_custom.cpp" "$dst\Telegram\SourceFiles\settings\sections\"
          Copy-Item -Force "$src\Telegram\SourceFiles\settings\sections\settings_main.cpp" "$dst\Telegram\SourceFiles\settings\sections\"
          Copy-Item -Force "$src\Telegram\SourceFiles\chat_helpers\stickers_list_widget.cpp" "$dst\Telegram\SourceFiles\chat_helpers\"
          Copy-Item -Force "$src\Telegram\SourceFiles\core\click_handler_types.cpp" "$dst\Telegram\SourceFiles\core\"
          Copy-Item -Force "$src\Telegram\SourceFiles\core\file_utilities.cpp" "$dst\Telegram\SourceFiles\core\"
          Copy-Item -Force "$src\Telegram\SourceFiles\core\application.cpp" "$dst\Telegram\SourceFiles\core\"
          Copy-Item -Force "$src\Telegram\SourceFiles\core\update_checker.cpp" "$dst\Telegram\SourceFiles\core\"
          Copy-Item -Force "$src\Telegram\SourceFiles\core\sandbox.cpp" "$dst\Telegram\SourceFiles\core\"
          Copy-Item -Force "$src\Telegram\SourceFiles\core\version.h" "$dst\Telegram\SourceFiles\core\"
          Copy-Item -Force "$src\Telegram\SourceFiles\data\stickers\data_stickers.cpp" "$dst\Telegram\SourceFiles\data\stickers\"
          Copy-Item -Force "$src\Telegram\SourceFiles\data\data_document.cpp" "$dst\Telegram\SourceFiles\data\"
          Copy-Item -Force "$src\Telegram\SourceFiles\data\components\sponsored_messages.cpp" "$dst\Telegram\SourceFiles\data\components\"
          Copy-Item -Force "$src\Telegram\SourceFiles\dialogs\dialogs_widget.cpp" "$dst\Telegram\SourceFiles\dialogs\"
          Copy-Item -Force "$src\Telegram\SourceFiles\dialogs\ui\dialogs_layout.cpp" "$dst\Telegram\SourceFiles\dialogs\ui\"
          Copy-Item -Force "$src\Telegram\SourceFiles\main\main_session.cpp" "$dst\Telegram\SourceFiles\main\"
          Copy-Item -Force "$src\Telegram\SourceFiles\ui\chat\chat_style_radius.cpp" "$dst\Telegram\SourceFiles\ui\chat\"
          Copy-Item -Force "$src\Telegram\SourceFiles\platform\win\main_window_win.cpp" "$dst\Telegram\SourceFiles\platform\win\"
          Copy-Item -Force "$src\Telegram\SourceFiles\platform\win\windows_dlls.h" "$dst\Telegram\SourceFiles\platform\win\"
          Copy-Item -Force "$src\Telegram\SourceFiles\window\window_controller.cpp" "$dst\Telegram\SourceFiles\window\"
          Copy-Item -Force "$src\Telegram\SourceFiles\window\main_window.cpp" "$dst\Telegram\SourceFiles\window\"
          Copy-Item -Force "$src\Telegram\SourceFiles\api\api_attached_stickers.h" "$dst\Telegram\SourceFiles\api\"
          Copy-Item -Force "$src\Telegram\SourceFiles\api\api_attached_stickers.cpp" "$dst\Telegram\SourceFiles\api\"
          Copy-Item -Force "$src\Telegram\SourceFiles\boxes\stickers_box.h" "$dst\Telegram\SourceFiles\boxes\"
          Copy-Item -Force "$src\Telegram\SourceFiles\boxes\stickers_box.cpp" "$dst\Telegram\SourceFiles\boxes\"
          Copy-Item -Force "$src\Telegram\SourceFiles\history\view\history_view_context_menu.cpp" "$dst\Telegram\SourceFiles\history\view\"
          Copy-Item -Force "$src\Telegram\SourceFiles\window\themes\window_theme.cpp" "$dst\Telegram\SourceFiles\window\themes\"
          Copy-Item -Force "$src\Telegram\SourceFiles\window\themes\window_themes_embedded.cpp" "$dst\Telegram\SourceFiles\window\themes\"
          Copy-Item -Force "$src\custom_patches\lib_ui\ui\ui_utility.h" "$dst\Telegram\lib_ui\ui\"
          Copy-Item -Force "$src\custom_patches\lib_ui\ui\ui_utility.cpp" "$dst\Telegram\lib_ui\ui\"
          Copy-Item -Force "$src\custom_patches\lib_ui\ui\widgets\elastic_scroll.h" "$dst\Telegram\lib_ui\ui\widgets\"
          Copy-Item -Force "$src\custom_patches\lib_ui\ui\widgets\elastic_scroll.cpp" "$dst\Telegram\lib_ui\ui\widgets\"
          Copy-Item -Force "$src\custom_patches\lib_ui\ui\widgets\scroll_area.h" "$dst\Telegram\lib_ui\ui\widgets\"
          Copy-Item -Force "$src\custom_patches\lib_ui\ui\widgets\scroll_area.cpp" "$dst\Telegram\lib_ui\ui\widgets\"
          Copy-Item -Force "$src\Telegram\build\prepare\prepare.py" "$dst\Telegram\build\prepare\"
          Copy-Item -Force "$src\Telegram\CMakeLists.txt" "$dst\Telegram\"
          
          # Delete custom_src to save disk space
          Remove-Item -Recurse -Force $src -ErrorAction SilentlyContinue
          Write-Host "[✓] Custom modifications applied and temp files cleaned!"

      - name: Setup MSVC
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          toolset: '14.44'

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Prepare Third-Party Libraries
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          %TBUILD%\TelegramCustom\Telegram\build\prepare\win.bat skip-release silent

      - name: Free Library Build Artifacts Space
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "Cleaning intermediate build files from Libraries..."
          find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete || true

      - name: Build Telegram Desktop
        run: |
          cd %TBUILD%\TelegramCustom\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=17349 ^
          -D TDESKTOP_API_HASH=344583e45741c457fe1862106095a5eb ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D CMAKE_CXX_FLAGS="/FS /MP" ^
          -D CMAKE_C_FLAGS="/FS /MP" ^
          -D CMAKE_EXE_LINKER_FLAGS="/DEBUG:NONE /INCREMENTAL:NO" ^
          -D CMAKE_SHARED_LINKER_FLAGS="/DEBUG:NONE /INCREMENTAL:NO" ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config Debug --parallel 4

      - name: Prepare Artifact
        shell: pwsh
        run: |
          $out = "$env:TBUILD\TelegramCustom\out\Debug"
          $artifact = "$env:GITHUB_WORKSPACE\artifact"
          New-Item -ItemType Directory -Force -Path $artifact
          
          # Download official tg-ws-proxy binary (Flowseal)
          $proxyUrl = "https://github.com/Flowseal/tg-ws-proxy/releases/download/v1.10.2/TgWsProxy_windows.exe"
          $proxyOut = "$out\tg-ws-proxy.exe"
          $proxyArtifact = "$artifact\tg-ws-proxy.exe"
          Write-Host "Downloading tg-ws-proxy from $proxyUrl..."
          try {
              Invoke-WebRequest -Uri $proxyUrl -OutFile $proxyOut
              Copy-Item -Force $proxyOut $proxyArtifact
              Write-Host "[✓] tg-ws-proxy successfully bundled!"
          } catch {
              Write-Warning "Failed to download tg-ws-proxy: $_"
          }
          
          Copy-Item -Force "$out\Telegram.exe" "$artifact\"
          if (Test-Path "$out\Updater.exe") {
              Copy-Item -Force "$out\Updater.exe" "$artifact\"
          }
          Write-Host "[✓] Artifact prepared with Telegram.exe and bundled tg-ws-proxy.exe!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramCustom-Windows-x64
          path: artifact\
